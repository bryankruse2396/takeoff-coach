# Tests the coach, then builds TakeoffCoach.exe on a Windows machine and publishes it as a GitHub release.
# Runs whenever the coach's code changes on main (tests only, for pull requests). A release is only made
# when COACH_VERSION in coach/config.py is new; the coach's self-updater then offers it to every learner.
name: Test and build Takeoff Coach

on:
  push:
    branches: [main]
    paths: [takeoff_coach.py, coach/**, tests/**, build/**, pyproject.toml, .github/workflows/build.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the test tools
        run: |
          sudo apt-get install -y -qq xvfb
          python -m pip install pytest ruff pillow

      - name: Check the code for mistakes (unused or undefined names)
        run: ruff check

      - name: Run the tests (window tests on a virtual screen)
        run: xvfb-run -a python -m pytest -v

  build:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the coach's packages
        run: python -m pip install -r build/requirements.txt

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path coach/config.py -Pattern '^COACH_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "COACH_VERSION not found" }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          "exists=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT
          exit 0  # "release not found" is the normal case for a new version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write .env from the repository secrets (never committed)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_PUBLISHABLE_KEY) {
            throw "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets (Settings > Secrets and variables > Actions)."
          }
          "SUPABASE_URL=$env:SUPABASE_URL`nSUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" |
            Set-Content -Encoding utf8NoBOM .env

      - name: Build TakeoffCoach.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name TakeoffCoach
          --collect-all winrt
          --hidden-import winrt.windows.media.ocr --hidden-import winrt.windows.graphics.imaging
          --hidden-import winrt.windows.storage.streams --hidden-import winrt.windows.globalization
          --hidden-import winrt.windows.foundation --hidden-import winrt.windows.foundation.collections
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import comtypes.client --hidden-import comtypes.stream
          --add-data ".env;."
          takeoff_coach.py

      - name: Self-test the built program
        shell: pwsh
        run: |
          $out = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'TakeoffCoach\selftest.txt'
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process dist\TakeoffCoach.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "Self-test failed (exit $($p.ExitCode))" }
          Get-Content $out

      - name: Write latest.json
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $sha = (Get-FileHash dist\TakeoffCoach.exe -Algorithm SHA256).Hash.ToLower()
          @{ version = $v; url = "https://github.com/${{ github.repository }}/releases/download/v$v/TakeoffCoach.exe"; sha256 = $sha } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist\latest.json
          Get-Content dist\latest.json

      - name: Keep the build (downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: TakeoffCoach-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish the release
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          gh release create "v$v" dist\TakeoffCoach.exe dist\latest.json --title "Takeoff Coach $v" --notes "Takeoff Coach $v" --latest
